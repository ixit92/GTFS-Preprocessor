version: 2
updates:
  - package-ecosystem: maven
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    groups:
      maven-updates:
        patterns:
          - "*"
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    groups:
      github-actions-updates:
        patterns:
          - "*"
    commit-message:
      prefix: ci
