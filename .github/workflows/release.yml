name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify tag matches Maven version
        shell: bash
        run: |
          project_version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test "$GITHUB_REF_NAME" = "v${project_version}"
          echo "PROJECT_VERSION=${project_version}" >> "$GITHUB_ENV"

      - name: Build release artifacts
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Prepare checksums
        shell: bash
        run: |
          mkdir dist
          cp "target/gtfs-preprocessor-${PROJECT_VERSION}.jar" dist/
          cp "target/gtfs-preprocessor-${PROJECT_VERSION}-sbom.json" dist/
          cp "target/gtfs-preprocessor-${PROJECT_VERSION}-sbom.xml" dist/
          (cd dist && sha256sum *.jar *.json *.xml > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "IXIT GTFS Preprocessor ${GITHUB_REF_NAME}" \
            --notes-file "docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
